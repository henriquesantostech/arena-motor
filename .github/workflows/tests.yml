# Engine tests on made-up data, whenever the code changes.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          pip install -q -r requirements.txt
          if [ -f requirements-intel.txt ]; then pip install -q -r requirements-intel.txt; fi
      - run: python -m pytest -q
