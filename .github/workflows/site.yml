# Publishes the private site (built by the nightly run into the private archive) to Cloudflare Pages,
# behind a GitHub sign-in (site/functions/_middleware.js). Runs after every nightly run, or by hand.
# Logs are public: site/publish.mjs prints only "ok"/"STOP", never addresses, e-mails or data.
name: site

on:
  workflow_run:
    workflows: [nightly, intel]   # after the engine's night and after the intelligence layer (05:30 UTC, ~80 min)
    types: [completed]
  push:   # a new version of the site goes live at once
    branches: [main]
    paths: ["site/dist/**", "site/functions/**", "site/publish.mjs", "arena/site.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Engine (this repository)
        uses: actions/checkout@v4

      - name: Private archive
        uses: actions/checkout@v4
        with:
          repository: henriquesantostech/arena-arquivo
          path: archive
          ssh-key: ${{ secrets.ARQUIVO_CHAVE }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Rebuild the site with this version of the app (the archive is not changed)
        run: |
          pip install -q -r requirements.txt
          python -m arena site --archive archive

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the login gate
        run: node --test site/tests/gate.test.mjs site/tests/ask.test.mjs

      - name: Publish behind the login
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID || 'Ov23liYpWAiewp1kFidN' }}   # public by design (shown in the sign-in URL)
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          ARENA_SESSION_KEY: ${{ secrets.ARENA_SESSION_KEY }}
          ARENA_ALLOWED_USERS: ${{ secrets.ARENA_ALLOWED_USERS || github.repository_owner }}
        run: node site/publish.mjs archive/site
